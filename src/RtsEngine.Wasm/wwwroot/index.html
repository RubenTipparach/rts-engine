<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RTS Engine - Silk.NET WASM</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">X</a>
    </div>
    <!-- Eruda: on-screen console for mobile debugging.
         Auto-enable on touch devices (phones / tablets) — without it there's
         no way to read JS errors there. Desktop has F12 DevTools so we
         keep it OPT-IN via ?eruda=1, otherwise Eruda's console hooks attach
         a stack-trace to every log line and bury real errors in DevTools.
         Either form can be forced off via ?noeruda. -->
    <script>
      (function () {
        var qs = new URLSearchParams(location.search);
        if (qs.has('noeruda')) return;
        var isTouch = matchMedia('(pointer: coarse)').matches
                   || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        var want = qs.has('eruda') || isTouch;
        if (!want) return;
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda@3.0.1/eruda.min.js';
        s.onload = function () { eruda.init(); };
        document.head.appendChild(s);
      })();
    </script>

    <script src="js/gpu-proxy.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
